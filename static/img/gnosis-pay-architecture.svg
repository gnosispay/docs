<svg viewBox="0 0 1060 560" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0730"/>
      <stop offset="1" stop-color="#14114a"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#241f74"/>
      <stop offset="1" stop-color="#1a1660"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1060" height="560" rx="20" fill="url(#panel)"/>

  <!-- side captions -->
  <text x="530" y="44" text-anchor="middle" fill="#cbfb6c" font-size="13" font-weight="700" letter-spacing="2">IDENTITY &amp; ONBOARDING</text>
  <text x="530" y="536" text-anchor="middle" fill="#cbfb6c" font-size="13" font-weight="700" letter-spacing="2">CUSTODY, PROCESSING &amp; SETTLEMENT</text>

  <!-- ===== TOP external systems ===== -->
  <rect x="120" y="70" width="180" height="80" rx="12" fill="#1d1a57" stroke="rgba(203,251,108,0.35)"/>
  <text x="210" y="104" text-anchor="middle" fill="#fbebd4" font-size="13.5" font-weight="600">User Wallet</text>
  <text x="210" y="126" text-anchor="middle" fill="#a9a4e0" font-size="10.5">SIWE sign-in + Email/TOS</text>

  <rect x="440" y="70" width="180" height="80" rx="12" fill="#1d1a57" stroke="rgba(203,251,108,0.35)"/>
  <text x="530" y="104" text-anchor="middle" fill="#fbebd4" font-size="13.5" font-weight="600">Sumsub</text>
  <text x="530" y="126" text-anchor="middle" fill="#a9a4e0" font-size="10.5">KYC &amp; identity</text>

  <rect x="760" y="70" width="180" height="80" rx="12" fill="#1d1a57" stroke="rgba(203,251,108,0.35)"/>
  <text x="850" y="104" text-anchor="middle" fill="#fbebd4" font-size="13.5" font-weight="600">Partner Integration</text>
  <text x="850" y="126" text-anchor="middle" fill="#a9a4e0" font-size="10.5">APIs · Dashboard · Webhooks</text>

  <!-- ===== CENTER hub: Gnosis Pay ===== -->
  <rect x="60" y="225" width="940" height="90" rx="16" fill="url(#hub)" stroke="#cbfb6c" stroke-width="2"/>
  <text x="530" y="262" text-anchor="middle" fill="#fbebd4" font-size="23" font-weight="700" letter-spacing="1">GNOSIS PAY</text>
  <text x="530" y="281" text-anchor="middle" fill="#cbfb6c" font-size="11" letter-spacing="1">orchestration layer</text>

  <!-- ===== BOTTOM external systems ===== -->
  <rect x="95" y="410" width="170" height="80" rx="12" fill="#1d1a57" stroke="rgba(203,251,108,0.35)"/>
  <text x="180" y="444" text-anchor="middle" fill="#fbebd4" font-size="13.5" font-weight="600">Pismo</text>
  <text x="180" y="466" text-anchor="middle" fill="#a9a4e0" font-size="10.5">payment processor + ledger</text>

  <rect x="315" y="410" width="170" height="80" rx="12" fill="#211d6b" stroke="#cbfb6c" stroke-width="1.5"/>
  <text x="400" y="444" text-anchor="middle" fill="#fbebd4" font-size="13.5" font-weight="600">Spending Safe</text>
  <text x="400" y="466" text-anchor="middle" fill="#cbfb6c" font-size="10.5">self-custody · user funds</text>

  <rect x="535" y="410" width="170" height="80" rx="12" fill="#1d1a57" stroke="#f0b34a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="620" y="444" text-anchor="middle" fill="#fbebd4" font-size="13.5" font-weight="600">Monavate</text>
  <text x="620" y="466" text-anchor="middle" fill="#f0b34a" font-size="10.5">settlement (every 12h)</text>

  <rect x="755" y="410" width="170" height="80" rx="12" fill="#1d1a57" stroke="rgba(203,251,108,0.35)"/>
  <text x="840" y="444" text-anchor="middle" fill="#fbebd4" font-size="13.5" font-weight="600">Visa</text>
  <text x="840" y="466" text-anchor="middle" fill="#a9a4e0" font-size="10.5">card network</text>

  <!-- ===== connectors (top -> hub) ===== -->
  <line x1="210" y1="150" x2="210" y2="225" stroke="rgba(203,251,108,0.55)" stroke-width="1.5"/>
  <circle cx="210" cy="225" r="3.5" fill="#cbfb6c"/>
  <text x="218" y="192" fill="#a9a4e0" font-size="9.5">SIWE</text>

  <line x1="530" y1="150" x2="530" y2="225" stroke="rgba(203,251,108,0.55)" stroke-width="1.5"/>
  <circle cx="530" cy="225" r="3.5" fill="#cbfb6c"/>
  <text x="538" y="192" fill="#a9a4e0" font-size="9.5">KYC data</text>

  <line x1="850" y1="150" x2="850" y2="225" stroke="rgba(203,251,108,0.55)" stroke-width="1.5"/>
  <circle cx="850" cy="225" r="3.5" fill="#cbfb6c"/>
  <text x="858" y="192" fill="#a9a4e0" font-size="9.5">integration</text>

  <!-- ===== connectors (hub -> bottom) ===== -->
  <line x1="180" y1="335" x2="180" y2="410" stroke="rgba(203,251,108,0.55)" stroke-width="1.5"/>
  <circle cx="180" cy="335" r="3.5" fill="#cbfb6c"/>
  <text x="188" y="378" fill="#a9a4e0" font-size="9.5">auth + processing</text>

  <line x1="400" y1="335" x2="400" y2="410" stroke="rgba(203,251,108,0.55)" stroke-width="1.5"/>
  <circle cx="400" cy="335" r="3.5" fill="#cbfb6c"/>
  <text x="408" y="378" fill="#a9a4e0" font-size="9.5">custody</text>

  <line x1="620" y1="335" x2="620" y2="410" stroke="rgba(240,179,74,0.6)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="620" cy="335" r="3.5" fill="#f0b34a"/>
  <text x="628" y="378" fill="#f0b34a" font-size="9.5">12h settlement</text>

  <line x1="840" y1="335" x2="840" y2="410" stroke="rgba(203,251,108,0.55)" stroke-width="1.5"/>
  <circle cx="840" cy="335" r="3.5" fill="#cbfb6c"/>
  <text x="848" y="378" fill="#a9a4e0" font-size="9.5">card rail</text>


</svg>
