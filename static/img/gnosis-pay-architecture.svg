<svg viewBox="0 0 1180 612" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0730"/>
      <stop offset="1" stop-color="#14114a"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#241f74"/>
      <stop offset="1" stop-color="#1a1660"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1180" height="612" rx="20" fill="url(#panel)"/>

  <!-- section captions -->
  <text x="475" y="42" text-anchor="middle" fill="#cbfb6c" font-size="13" font-weight="700" letter-spacing="2">PARTNER INTEGRATION</text>
  <text x="590" y="590" text-anchor="middle" fill="#cbfb6c" font-size="13" font-weight="700" letter-spacing="2">COMPLIANCE · CUSTODY · PAYMENT PROCESSING &amp; RAILS</text>

  <!-- ===== TOP: Sumsub + Partner ===== -->
  <rect x="110" y="112" width="160" height="80" rx="12" fill="#1d1a57" stroke="rgba(203,251,108,0.35)"/>
  <text x="190" y="148" text-anchor="middle" fill="#fbebd4" font-size="13" font-weight="600">Sumsub</text>
  <text x="190" y="168" text-anchor="middle" fill="#a9a4e0" font-size="10">KYC &amp; identity</text>

  <!-- Sumsub -> Partner integration connector -->
  <line x1="270" y1="152" x2="300" y2="152" stroke="rgba(203,251,108,0.55)" stroke-width="1.5"/>
  <circle cx="270" cy="152" r="3.5" fill="#cbfb6c"/>
  <circle cx="300" cy="152" r="3.5" fill="#cbfb6c"/>
  <text x="285" y="144" text-anchor="middle" fill="#a9a4e0" font-size="9.5">KYC</text>

  <rect x="300" y="66" width="580" height="134" rx="14" fill="#1d1a57" stroke="rgba(203,251,108,0.35)"/>
  <text x="590" y="96" text-anchor="middle" fill="#fbebd4" font-size="15" font-weight="700" letter-spacing="2">PARTNER</text>
  <text x="590" y="114" text-anchor="middle" fill="#cbfb6c" font-size="10.5">one partner · one API token</text>

  <rect x="312" y="126" width="128" height="52" rx="10" fill="#14114a" stroke="rgba(203,251,108,0.3)"/>
  <text x="376" y="148" text-anchor="middle" fill="#fbebd4" font-size="11" font-weight="600">Onboarding API</text>
  <text x="376" y="165" text-anchor="middle" fill="#a9a4e0" font-size="9">SIWE · KYC · TOS</text>

  <rect x="454" y="126" width="128" height="52" rx="10" fill="#14114a" stroke="rgba(203,251,108,0.3)"/>
  <text x="518" y="148" text-anchor="middle" fill="#fbebd4" font-size="11" font-weight="600">Webhooks</text>
  <text x="518" y="165" text-anchor="middle" fill="#a9a4e0" font-size="9">real-time events</text>

  <rect x="596" y="126" width="128" height="52" rx="10" fill="#14114a" stroke="rgba(203,251,108,0.3)"/>
  <text x="660" y="148" text-anchor="middle" fill="#fbebd4" font-size="11" font-weight="600">Dashboard</text>
  <text x="660" y="165" text-anchor="middle" fill="#a9a4e0" font-size="9">B2C support</text>

  <rect x="738" y="126" width="128" height="52" rx="10" fill="#14114a" stroke="rgba(203,251,108,0.3)"/>
  <text x="802" y="148" text-anchor="middle" fill="#fbebd4" font-size="11" font-weight="600">PSE</text>
  <text x="802" y="165" text-anchor="middle" fill="#a9a4e0" font-size="9">Sensitive card details</text>

  <!-- one-token connector -->
  <line x1="590" y1="200" x2="590" y2="270" stroke="#cbfb6c" stroke-width="2.5"/>
  <circle cx="590" cy="200" r="4" fill="#cbfb6c"/>
  <circle cx="590" cy="270" r="4" fill="#cbfb6c"/>
  <rect x="512" y="223" width="156" height="24" rx="12" fill="#0a0730" stroke="#cbfb6c"/>
  <text x="590" y="239" text-anchor="middle" fill="#cbfb6c" font-size="10" font-weight="600">one partner = one token</text>

  <!-- ===== CENTER hub: Gnosis Pay ===== -->
  <rect x="70" y="270" width="1040" height="120" rx="16" fill="url(#hub)" stroke="#cbfb6c" stroke-width="2"/>
  <text x="590" y="308" text-anchor="middle" fill="#fbebd4" font-size="23" font-weight="700" letter-spacing="1">GNOSIS PAY</text>
  <text x="590" y="328" text-anchor="middle" fill="#cbfb6c" font-size="11" letter-spacing="1">API orchestration layer</text>

  <rect x="320" y="348" width="140" height="30" rx="15" fill="#14114a" stroke="rgba(203,251,108,0.3)"/>
  <text x="390" y="368" text-anchor="middle" fill="#d9d5f5" font-size="11.5" font-weight="600">Account</text>
  <rect x="480" y="348" width="140" height="30" rx="15" fill="#14114a" stroke="rgba(203,251,108,0.3)"/>
  <text x="550" y="368" text-anchor="middle" fill="#d9d5f5" font-size="11.5" font-weight="600">Card</text>
  <rect x="640" y="348" width="220" height="30" rx="15" fill="#14114a" stroke="rgba(203,251,108,0.3)"/>
  <text x="750" y="368" text-anchor="middle" fill="#d9d5f5" font-size="11.5" font-weight="600">Processing + Settlement</text>

  <!-- ===== BOTTOM external systems (5) ===== -->
  <rect x="105" y="470" width="170" height="90" rx="12" fill="#1d1a57" stroke="rgba(203,251,108,0.35)"/>
  <text x="190" y="510" text-anchor="middle" fill="#fbebd4" font-size="13" font-weight="600">KYT</text>
  <text x="190" y="532" text-anchor="middle" fill="#a9a4e0" font-size="10">AML on deposit</text>

  <rect x="305" y="470" width="170" height="90" rx="12" fill="#211d6b" stroke="#cbfb6c" stroke-width="1.5"/>
  <text x="390" y="510" text-anchor="middle" fill="#fbebd4" font-size="13" font-weight="600">Spending Safe</text>
  <text x="390" y="532" text-anchor="middle" fill="#cbfb6c" font-size="10">self-custody · funds</text>

  <rect x="505" y="470" width="170" height="90" rx="12" fill="#1d1a57" stroke="rgba(203,251,108,0.35)"/>
  <text x="590" y="510" text-anchor="middle" fill="#fbebd4" font-size="13" font-weight="600">Pismo</text>
  <text x="590" y="532" text-anchor="middle" fill="#a9a4e0" font-size="10">payment processor</text>

  <rect x="705" y="470" width="170" height="90" rx="12" fill="#1d1a57" stroke="#f0b34a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="790" y="510" text-anchor="middle" fill="#fbebd4" font-size="13" font-weight="600">Monavate</text>
  <text x="790" y="532" text-anchor="middle" fill="#f0b34a" font-size="10">settlement · 12h</text>

  <rect x="905" y="470" width="170" height="90" rx="12" fill="#1d1a57" stroke="rgba(203,251,108,0.35)"/>
  <text x="990" y="510" text-anchor="middle" fill="#fbebd4" font-size="13" font-weight="600">Visa</text>
  <text x="990" y="532" text-anchor="middle" fill="#a9a4e0" font-size="10">card network</text>

  <!-- KYT screens deposits into Safe -->
  <line x1="275" y1="515" x2="305" y2="515" stroke="#cbfb6c" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- connectors hub -> bottom -->
  <line x1="190" y1="390" x2="190" y2="470" stroke="rgba(203,251,108,0.55)" stroke-width="1.5"/>
  <circle cx="190" cy="390" r="3.5" fill="#cbfb6c"/>
  <text x="198" y="434" fill="#a9a4e0" font-size="9.5">AML screening</text>

  <line x1="390" y1="390" x2="390" y2="470" stroke="rgba(203,251,108,0.55)" stroke-width="1.5"/>
  <circle cx="390" cy="390" r="3.5" fill="#cbfb6c"/>
  <text x="398" y="434" fill="#a9a4e0" font-size="9.5">custody</text>

  <line x1="590" y1="390" x2="590" y2="470" stroke="rgba(203,251,108,0.55)" stroke-width="1.5"/>
  <circle cx="590" cy="390" r="3.5" fill="#cbfb6c"/>
  <text x="598" y="434" fill="#a9a4e0" font-size="9.5">processing</text>

  <line x1="790" y1="390" x2="790" y2="470" stroke="rgba(240,179,74,0.6)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="790" cy="390" r="3.5" fill="#f0b34a"/>
  <text x="798" y="434" fill="#f0b34a" font-size="9.5">12h settlement</text>

  <line x1="990" y1="390" x2="990" y2="470" stroke="rgba(203,251,108,0.55)" stroke-width="1.5"/>
  <circle cx="990" cy="390" r="3.5" fill="#cbfb6c"/>
  <text x="998" y="434" fill="#a9a4e0" font-size="9.5">card rail</text>

</svg>
